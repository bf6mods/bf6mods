name: Publish Packages

on:
    push:
        tags:
            - "cli-v*" # Triggers for CLI package releases
            - "portal-v*" # Triggers for portal package releases
            - "sdk-v*" # Triggers for SDK package releases

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org/"

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libsecret-1-0

            # Trusted publishing (OIDC) needs npm 11.5+. npm 12 blocks dependency
            # install scripts by default, which breaks keytar, so stay on 11.
            - name: Update npm
              run: npm install -g npm@11

            - name: Install dependencies
              run: npm ci

            - name: Run build
              run: npm run build

            - name: Run tests
              run: npm run test

            - name: Publish CLI
              if: startsWith(github.ref_name, 'cli-v')
              run: npm publish --workspace @bf6mods/cli

            - name: Publish Portal
              if: startsWith(github.ref_name, 'portal-v')
              run: npm publish --workspace @bf6mods/portal

            - name: Publish SDK
              if: startsWith(github.ref_name, 'sdk-v')
              run: npm publish --workspace @bf6mods/sdk
